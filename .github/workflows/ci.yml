name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  test:
    name: Test, build, and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt
      - name: Scan Python source code
        run: bandit --recursive app
      - name: Run tests
        run: python -m pytest -v
      - name: Build Docker image
        run: docker build --tag secure-api:ci .
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  infrastructure:
    name: Validate and scan Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check

      - name: Initialize Terraform
        run: terraform -chdir=infrastructure init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infrastructure validate -no-color

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  integration-test:
    name: Test API with LocalStack
    needs:
      - test
      - infrastructure
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      API_KEY: ${{ secrets.API_KEY }}
      RUN_INTEGRATION_TESTS: "1"
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: "latest"
          install-awslocal: "true"
          use-pro: "true"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: Create local AWS infrastructure
        run: |
          terraform -chdir=infrastructure init -backend=false -input=false
          terraform -chdir=infrastructure apply -auto-approve -input=false

      - name: Run LocalStack integration test
        run: python -m pytest tests/integration/test_localstack.py -v
